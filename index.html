<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BasicApp - Day 1" />
    <title>BasicApp</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <h1 class="logo">BasicApp</h1>
        <nav class="nav">
          <a href="/">Home</a>
          <a href="#about">About</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <div class="hero-text">
              <h2>Welcome to BasicApp</h2>
              <p>Built with vanilla HTML, CSS, and JavaScript.</p>
              <div class="hero-actions">
                <button class="btn btn-primary">Get Started</button>
                <button class="btn btn-outline">Learn More</button>
              </div>
            </div>
            <div class="hero-visual">
              <div class="liquid-blob" aria-hidden="true">
                <div class="blob-reflection"></div>
                <div class="blob-highlight"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>&copy; 2026 BasicApp. All rights reserved.</p>
      </div>
    </footer>

    <script src="scripts/main.js"></script>
  </body>
</html>
