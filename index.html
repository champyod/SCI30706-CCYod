<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BasicApp - Day 1" />
    <title>BasicApp</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <h1 class="logo">BasicApp</h1>
        <nav class="nav">
          <a href="/">Home</a>
          <a href="#about">About</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container">
          <div class="hero-content">
            <div class="hero-text">
              <h2>Welcome to BasicApp</h2>
              <p>Built with vanilla HTML, CSS, and JavaScript.</p>
              <div class="hero-actions">
                <button class="btn btn-primary">Get Started</button>
                <button class="btn btn-outline">Learn More</button>
              </div>
            </div>
            <div class="hero-visual">
              <div class="blob-stage" id="blobStage">
                <div class="blob-bg-mesh" aria-hidden="true">
                  <div class="mesh-dot" style="top:15%;left:20%;width:80px;height:80px;background:#7209b7;opacity:.4"></div>
                  <div class="mesh-dot" style="top:60%;left:10%;width:120px;height:120px;background:#4361ee;opacity:.3"></div>
                  <div class="mesh-dot" style="top:10%;left:65%;width:100px;height:100px;background:#f72585;opacity:.35"></div>
                  <div class="mesh-dot" style="top:70%;left:70%;width:90px;height:90px;background:#4cc9f0;opacity:.3"></div>
                  <div class="mesh-dot" style="top:40%;left:50%;width:60px;height:60px;background:#f8961e;opacity:.25"></div>
                </div>
                <div class="liquid-blob" id="glassBlob">
                  <div class="blob-reflection" id="blobReflection"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>&copy; 2026 BasicApp. All rights reserved.</p>
      </div>
    </footer>

    <script src="scripts/main.js"></script>
  </body>
</html>
